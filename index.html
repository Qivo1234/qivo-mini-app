<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QIVO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0b1020;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header {
      position: absolute;
      top: 24px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 1px;
    }

    .balance-box {
      position: absolute;
      top: 90px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .balance-label {
      font-size: 12px;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance {
      margin-top: 5px;
      font-size: 30px;
      font-weight: 700;
    }

    .tap-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 185px;
      height: 185px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #7567ff, #4b3bd4);
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        inset 0 4px 10px rgba(255, 255, 255, 0.25);
      transition: transform 0.08s ease;
    }

    .tap-button:active {
      transform: scale(0.93);
    }

    .tap-button.disabled {
      opacity: 0.45;
      transform: scale(0.96);
    }

    .stats {
      position: absolute;
      bottom: 112px;
      width: min(330px, 86%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .stat-title {
      font-size: 11px;
      opacity: 0.55;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 700;
    }

    .energy-box {
      position: absolute;
      bottom: 68px;
      width: min(300px, 80%);
      text-align: center;
    }

    .energy-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .energy-label {
      opacity: 0.65;
    }

    .energy-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      overflow: hidden;
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #7567ff, #9a8fff);
      border-radius: 20px;
      transition: width 0.2s ease;
    }

    .actions {
      position: absolute;
      bottom: 15px;
      display: flex;
      gap: 8px;
    }

    .action-button {
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
    }

    .action-button:active {
      transform: scale(0.96);
    }

    .hint {
      position: absolute;
      bottom: 1px;
      font-size: 10px;
      opacity: 0.25;
    }

    @media (max-width: 400px) {
      .tap-button {
        width: 165px;
        height: 165px;
        font-size: 27px;
      }

      .stats {
        bottom: 108px;
      }

      .energy-box {
        bottom: 65px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">QIVO</div>
      <div class="subtitle">Crypto Tap</div>
    </header>

    <section class="balance-box">
      <div class="balance-label">Balance</div>

      <div class="balance">
        🪙 <span id="balance">0</span>
      </div>
    </section>

    <main class="tap-area">
      <button id="tapButton" class="tap-button" type="button">
        TAP
      </button>
    </main>

    <section class="stats">

      <div class="stat">
        <div class="stat-title">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>

      <div class="stat">
        <div class="stat-title">Tap Power</div>
        <div class="stat-value" id="tapPower">1</div>
      </div>

    </section>

    <section class="energy-box">

      <div class="energy-info">
        <span class="energy-label">Energy</span>

        <span>
          <span id="energy">1000</span> / 1000
        </span>
      </div>

      <div class="energy-bar">
        <div id="energyFill" class="energy-fill"></div>
      </div>

    </section>

    <div class="actions">

      <button id="dailyButton" class="action-button" type="button">
        🎁 Daily Reward
      </button>

      <button id="upgradeButton" class="action-button" type="button">
        ⚡ Upgrade
      </button>

    </div>

    <div class="hint">
      QIVO V1
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const MAX_ENERGY = 1000;
    const ENERGY_PER_TAP = 1;
    const ENERGY_RECHARGE_TIME = 3000;

    let balance =
      Number(localStorage.getItem("qivo_balance")) || 0;

    let energy =
      Number(localStorage.getItem("qivo_energy"));

    let level =
      Number(localStorage.getItem("qivo_level")) || 1;

    let tapPower =
      Number(localStorage.getItem("qivo_tap_power")) || 1;

    let lastDailyReward =
      Number(localStorage.getItem("qivo_daily_reward")) || 0;

    if (!Number.isFinite(energy)) {
      energy = MAX_ENERGY;
    }

    const balanceElement =
      document.getElementById("balance");

    const energyElement =
      document.getElementById("energy");

    const energyFill =
      document.getElementById("energyFill");

    const levelElement =
      document.getElementById("level");

    const tapPowerElement =
      document.getElementById("tapPower");

    const tapButton =
      document.getElementById("tapButton");

    const dailyButton =
      document.getElementById("dailyButton");

    const upgradeButton =
      document.getElementById("upgradeButton");

    function saveData() {
      localStorage.setItem(
        "qivo_balance",
        balance
      );

      localStorage.setItem(
        "qivo_energy",
        energy
      );

      localStorage.setItem(
        "qivo_level",
        level
      );

      localStorage.setItem(
        "qivo_tap_power",
        tapPower
      );

      localStorage.setItem(
        "qivo_daily_reward",
        lastDailyReward
      );
    }

    function updateUI() {
      balanceElement.textContent =
        balance.toLocaleString("en-US");

      energyElement.textContent =
        Math.floor(energy);

      levelElement.textContent =
        level;

      tapPowerElement.textContent =
        tapPower;

      energyFill.style.width =
        ((energy / MAX_ENERGY) * 100) + "%";

      tapButton.classList.toggle(
        "disabled",
        energy < ENERGY_PER_TAP
      );
    }

    tapButton.addEventListener(
      "click",
      function () {

        if (energy < ENERGY_PER_TAP) {
          return;
        }

        balance += tapPower;
        energy -= ENERGY_PER_TAP;

        saveData();
        updateUI();
      }
    );

    dailyButton.addEventListener(
      "click",
      function () {

        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;

        if (
          lastDailyReward === 0 ||
          now - lastDailyReward >= oneDay
        ) {

          const reward = 100;

          balance += reward;
          lastDailyReward = now;

          saveData();
          updateUI();

          alert(
            "Daily Reward claimed! +100 coins"
          );

        } else {

          const remaining =
            oneDay -
            (now - lastDailyReward);

          const hours =
            Math.ceil(
              remaining / (60 * 60 * 1000)
            );

          alert(
            "Daily Reward is available again in " +
            hours +
            " hours."
          );
        }
      }
    );

    upgradeButton.addEventListener(
      "click",
      function () {

        const cost = level * 100;

        if (balance < cost) {

          alert(
            "You need " +
            cost +
            " coins to upgrade."
          );

          return;
        }

        balance -= cost;
        level += 1;
        tapPower += 1;

        saveData();
        updateUI();

        alert(
          "Upgrade successful! Tap Power is now " +
          tapPower
        );
      }
    );

    setInterval(
      function () {

        if (energy < MAX_ENERGY) {

          energy += 1;

          if (energy > MAX_ENERGY) {
            energy = MAX_ENERGY;
          }

          saveData();
          updateUI();
        }

      },
      ENERGY_RECHARGE_TIME
    );

    updateUI();
  </script>

</body>
</html>
