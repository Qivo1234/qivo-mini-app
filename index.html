
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>QIVO</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0b1020;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header {
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 1px;
    }

    .balance-box {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .balance-label {
      font-size: 12px;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance {
      margin-top: 5px;
      font-size: 25px;
      font-weight: 700;
    }

    .tap-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 190px;
      height: 190px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(145deg, #7567ff, #4b3bd4);
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        inset 0 4px 10px rgba(255, 255, 255, 0.25);
      transition: transform 0.08s ease;
    }

    .tap-button:active {
      transform: scale(0.93);
    }

    .hint {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 13px;
      opacity: 0.5;
    }

    @media (max-width: 400px) {
      .tap-button {
        width: 170px;
        height: 170px;
        font-size: 27px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">QIVO</div>
      <div class="subtitle">Crypto Tap</div>
    </header>

    <section class="balance-box">
      <div class="balance-label">Balance</div>
      <div class="balance">
        <span id="balance">0</span>
      </div>
    </section>

    <main class="tap-area">
      <button id="tapButton" class="tap-button" type="button">
        TAP
      </button>
    </main>

    <div class="hint">
      Tap to collect coins
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let balance = 0;

    const balanceElement = document.getElementById("balance");
    const tapButton = document.getElementById("tapButton");

    tapButton.addEventListener("click", function () {
      balance += 1;
      balanceElement.textContent = balance.toLocaleString("en-US");
    });
  </script>

</body>
</html>
```
