
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crypto Tap</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 25px 18px;
      text-align: center;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
    }

    .user {
      margin-top: 8px;
      color: #94a3b8;
    }

    .balance {
      margin-top: 45px;
    }

    .balance-label {
      color: #94a3b8;
      font-size: 15px;
    }

    .coins {
      font-size: 42px;
      font-weight: bold;
      margin-top: 8px;
    }

    .tap-button {
      width: 210px;
      height: 210px;
      margin-top: 45px;
      border-radius: 50%;
      border: 8px solid rgba(255,255,255,0.12);
      background: linear-gradient(145deg, #facc15, #f59e0b);
      color: #111827;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
      transition: transform 0.08s;
    }

    .tap-button:active {
      transform: scale(0.94);
    }

    .hint {
      margin-top: 25px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="title">
      🪙 Crypto Tap
    </div>

    <div class="user" id="username">
      در حال ورود...
    </div>

    <div class="balance">
      <div class="balance-label">
        موجودی شما
      </div>

      <div class="coins" id="coins">
        0
      </div>
    </div>

    <button class="tap-button" id="tapButton">
      TAP
    </button>

    <div class="hint">
      برای دریافت سکه روی دکمه بزن
    </div>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const usernameElement = document.getElementById("username");
    const coinsElement = document.getElementById("coins");
    const tapButton = document.getElementById("tapButton");

    let coins = 0;

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

      const user = tg.initDataUnsafe.user;

      if (user.username) {
        usernameElement.textContent = "@" + user.username;
      } else {
        usernameElement.textContent =
          user.first_name || "کاربر";
      }

    } else {

      usernameElement.textContent = "کاربر تست";

    }

    tapButton.addEventListener("click", () => {

      coins++;

      coinsElement.textContent =
        coins.toLocaleString("en-US");

    });
  </script>

</body>
</html>
