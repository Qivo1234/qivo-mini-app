```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>QIVO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      color: white;
    }

    .title {
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .balance {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 18px;
      opacity: 0.9;
    }

    .tap-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: linear-gradient(145deg, #6d5dfc, #4738d8);
      color: white;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.35),
        inset 0 3px 8px rgba(255, 255, 255, 0.25);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: transform 0.08s ease;
    }

    .tap-button:active {
      transform: scale(0.94);
    }

    .hint {
      position: absolute;
      bottom: 35px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      opacity: 0.65;
    }

    @media (max-width: 400px) {
      .tap-button {
        width: 170px;
        height: 170px;
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="title">QIVO</div>

    <div class="balance">
      Balance: <span id="balance">0</span>
    </div>

    <div class="tap-container">
      <button class="tap-button" id="tapButton">
        TAP
      </button>
    </div>

    <div class="hint">
      Tap the button to collect coins
    </div>

  </main>

  <script>
    let balance = 0;

    const balanceElement = document.getElementById("balance");
    const tapButton = document.getElementById("tapButton");

    tapButton.addEventListener("click", () => {
      balance++;
      balanceElement.textContent = balance;
    });
  </script>

</body>
</html>
```
