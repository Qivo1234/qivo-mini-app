
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>QIVO</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0b1020;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header {
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 1px;
    }

    .balance-box {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .balance-label {
      font-size: 12px;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .balance {
      margin-top: 5px;
      font-size: 30px;
      font-weight: 700;
    }

    .coin-symbol {
      font-size: 22px;
      margin-right: 5px;
    }

    .tap-area {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tap-button {
      width: 190px;
      height: 190px;

      border: none;
      border-radius: 50%;

      background: linear-gradient(
        145deg,
        #7567ff,
        #4b3bd4
      );

      color: #ffffff;

      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;

      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.45),
        inset 0 4px 10px rgba(255, 255, 255, 0.25);

      transition: transform 0.08s ease;
    }

    .tap-button:active {
      transform: scale(0.93);
    }

    .tap-button.disabled {
      opacity: 0.45;
      transform: scale(0.96);
    }

    .energy-box {
      position: absolute;
      bottom: 82px;
      width: min(280px, 75%);
      text-align: center;
    }

    .energy-info {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 600;
    }

    .energy-label {
      opacity: 0.7;
    }

    .energy-value {
      opacity: 0.9;
    }

    .energy-bar {
      width: 100%;
      height: 8px;

      background: rgba(255, 255, 255, 0.12);

      border-radius: 20px;
      overflow: hidden;
    }

    .energy-fill {
      width: 100%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #7567ff,
        #9a8fff
      );

      border-radius: 20px;

      transition: width 0.2s ease;
    }

    .hint {
      position: absolute;
      bottom: 35px;
      left: 0;
      width: 100%;

      text-align: center;

      font-size: 12px;
      opacity: 0.45;
    }

    @media (max-width: 400px) {
      .tap-button {
        width: 170px;
        height: 170px;
        font-size: 27px;
      }

      .logo {
        font-size: 24px;
      }

      .energy-box {
        bottom: 78px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">QIVO</div>
      <div class="subtitle">Crypto Tap</div>
    </header>

    <section class="balance-box">
      <div class="balance-label">Balance</div>

      <div class="balance">
        <span class="coin-symbol">🪙</span>
        <span id="balance">0</span>
      </div>
    </section>

    <main class="tap-area">
      <button
        id="tapButton"
        class="tap-button"
        type="button"
      >
        TAP
      </button>
    </main>

    <section class="energy-box">

      <div class="energy-info">
        <span class="energy-label">Energy</span>

        <span class="energy-value">
          <span id="energy">1000</span> / 1000
        </span>
      </div>

      <div class="energy-bar">
        <div
          id="energyFill"
          class="energy-fill"
        ></div>
      </div>

    </section>

    <div class="hint">
      Tap to collect coins
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    /*
      QIVO V1
      Temporary local storage.
      Supabase will be connected later.
    */

    const MAX_ENERGY = 1000;

    const ENERGY_PER_TAP = 1;

    // 1 energy every 3 seconds
    const ENERGY_RECHARGE_TIME = 3000;

    let balance =
      Number(localStorage.getItem("qivo_balance")) || 0;

    let energy =
      Number(localStorage.getItem("qivo_energy"));

    if (!Number.isFinite(energy)) {
      energy = MAX_ENERGY;
    }

    const balanceElement =
      document.getElementById("balance");

    const energyElement =
      document.getElementById("energy");

    const energyFill =
      document.getElementById("energyFill");

    const tapButton =
      document.getElementById("tapButton");

    function updateUI() {

      balanceElement.textContent =
        balance.toLocaleString("en-US");

      energyElement.textContent =
        Math.floor(energy);

      const percentage =
        (energy / MAX_ENERGY) * 100;

      energyFill.style.width =
        percentage + "%";

      if (energy < ENERGY_PER_TAP) {
        tapButton.classList.add("disabled");
      } else {
        tapButton.classList.remove("disabled");
      }
    }

    function saveData() {

      localStorage.setItem(
        "qivo_balance",
        balance
      );

      localStorage.setItem(
        "qivo_energy",
        energy
      );
    }

    tapButton.addEventListener(
      "click",
      function () {

        if (energy < ENERGY_PER_TAP) {
          return;
        }

        // One tap = one coin
        balance += 1;

        // One tap consumes one energy
        energy -= ENERGY_PER_TAP;

        saveData();
        updateUI();

      }
    );

    /*
      Automatic energy recharge
    */

    setInterval(
      function () {

        if (energy < MAX_ENERGY) {

          energy += 1;

          if (energy > MAX_ENERGY) {
            energy = MAX_ENERGY;
          }

          saveData();
          updateUI();
        }

      },
      ENERGY_RECHARGE_TIME
    );

    updateUI();

  </script>

</body>
</html>
